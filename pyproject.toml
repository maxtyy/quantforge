[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "0.1.0"
description = "Reproducible quantitative research, cost-aware backtesting and local paper trading"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "QuantForge contributors"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "yfinance>=0.2.54,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
quantforge = "quantforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantforge = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
